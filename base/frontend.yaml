apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmos-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atmos-frontend
  template:
    metadata:
      labels:
        app: atmos-frontend
    spec:
      containers:
        - name: frontend
          image: streetflow13/project-atmos-frontend:latest
          ports:
            - name: http
              containerPort: 5173
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atmos-frontend
spec:
  selector:
    app: atmos-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
