apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmos-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atmos-backend
  template:
    metadata:
      labels:
        app: atmos-backend
    spec:
      containers:
        - name: backend
          image: streetflow13/project-atmos-backend:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atmos-secrets
                  key: openweather-api-key
            - name: MONGODB_URL
              value: mongodb://mongodb:27017
            - name: REDIS_URL
              value: redis://redis:6379
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atmos-backend
spec:
  selector:
    app: atmos-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
